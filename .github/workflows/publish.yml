# Builds the Docker image and publishes it to Docker Hub (and GitHub Container Registry).
#
# Triggers: every push to main (tags :latest, :main, :sha-<short>) and every version tag v1.2.3
# (tags :1.2.3, :1.2, :1). Pull requests are not published.
#
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   - Variable  DOCKERHUB_USERNAME  your Docker Hub username
#   - Secret    DOCKERHUB_TOKEN     a Docker Hub access token (hub.docker.com → Account settings →
#                                   Personal access tokens → "Read & Write")
# Without them the Docker Hub push is skipped and only ghcr.io is published.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # arm64 too, so it runs on a Raspberry Pi or an ARM VM.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: names
        run: |
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "$HAS_DOCKERHUB_TOKEN" = "true" ]; then
            names="$names"$'\n'"docker.io/${DOCKERHUB_USERNAME,,}/forgetless"
          fi
          { echo 'images<<EOF'; echo "$names"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
