<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f0e8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171411" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Save the shows, books, restaurants and places people tell you to try, and who told you."
		/>
		<!-- Self-hosted fonts (static/fonts, see scripts/copy-fonts.mjs), preloaded for the first render. -->
		<link
			rel="preload"
			href="/fonts/instrument-sans-wght.woff2"
			as="font"
			fetchpriority="low"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/newsreader-560.woff2"
			as="font"
			fetchpriority="low"
			type="font/woff2"
			crossorigin
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Forgetless" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			// PWA service worker, generated at build time by @vite-pwa/sveltekit (see vite.config.ts).
			// In `vite dev` /sw.js does not exist, so registration simply fails there.
			if ('serviceWorker' in navigator) {
				addEventListener('load', function () {
					navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
				});
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
